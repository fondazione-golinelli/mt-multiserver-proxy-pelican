name: Build and publish mt-multiserver-proxy Pelican image

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build even if this upstream commit is already published"
        type: boolean
        default: false

concurrency:
  group: proxy-pelican-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PROXY_UPSTREAM_REPO: fondazione-golinelli/mt-multiserver-proxy

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      proxy_sha: ${{ steps.upstream.outputs.proxy_sha }}
      proxy_short_sha: ${{ steps.upstream.outputs.proxy_short_sha }}
      marker: ${{ steps.upstream.outputs.marker }}
      should_build: ${{ steps.upstream.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Check published proxy and wrapper versions
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force_build || false }}
        run: bash check-image.sh

  build:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.should_build == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for runtime verification
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: skyss-proxy-ci:validation
          build-args: |
            MT_MULTISERVER_PROXY_REPO=${{ env.PROXY_UPSTREAM_REPO }}
            MT_MULTISERVER_PROXY_VERSION=${{ needs.check.outputs.proxy_sha }}
          cache-from: type=gha

      - name: Verify runtime plugin compatibility
        run: bash test-plugin-load.sh skyss-proxy-ci:validation

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            MT_MULTISERVER_PROXY_REPO=${{ env.PROXY_UPSTREAM_REPO }}
            MT_MULTISERVER_PROXY_VERSION=${{ needs.check.outputs.proxy_sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.check.outputs.marker }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.check.outputs.proxy_short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
